name: Release ChargingOverlay 1.1.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Verify version
        run: |
          VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          test "$VERSION" = "1.1.0"
          VERSION_CODE=$(grep -oP "versionCode \K[0-9]+" app/build.gradle)
          test "$VERSION_CODE" = "2"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare versioned APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "ChargingOverlay-1.1.0.apk"

      - name: Publish or confirm GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.0"
          APK="ChargingOverlay-1.1.0.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            ASSET_COUNT=$(gh release view "$TAG" --json assets --jq '.assets | map(select(.name == "'"$APK"'")) | length')

            if [ "$ASSET_COUNT" -eq 1 ]; then
              echo "Release $TAG already contains $APK. Nothing will be overwritten."
              exit 0
            fi

            echo "Release $TAG already exists but does not contain the expected APK."
            echo "Refusing to modify the existing release."
            exit 1
          fi

          gh release create "$TAG" "$APK" \
            --title "$TAG" \
            --generate-notes \
            --target main
