name: Build ChargingOverlay APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Copy APK into repository workspace
        run: cp app/build/outputs/apk/debug/app-debug.apk ChargingOverlay-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChargingOverlay-debug-apk
          path: ChargingOverlay-debug.apk
      - name: Commit APK to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChargingOverlay-debug.apk
          git diff --cached --quiet && exit 0
          git commit -m "Build installable ChargingOverlay APK"
          git push
