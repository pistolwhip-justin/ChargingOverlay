name: Build ChargingOverlay APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Read app version
        id: version
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "ChargingOverlay-${{ steps.version.outputs.version }}.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChargingOverlay-${{ steps.version.outputs.version }}
          path: "ChargingOverlay-${{ steps.version.outputs.version }}.apk"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          APK="ChargingOverlay-$VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "$TAG" \
              --generate-notes \
              --target main
          fi
